# Cada semana propone UNA sola actualización con parches y versiones menores.
# Los saltos de versión mayor (Tailwind 3→4, Next 16→17, etc.) se ignoran: rompen el sitio
# y hay que hacerlos a propósito y probándolos. Las alertas de seguridad de GitHub siguen activas aparte.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-y-parches:
        patterns: ["*"]
        update-types: ["minor", "patch"]
